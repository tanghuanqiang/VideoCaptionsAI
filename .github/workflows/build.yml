name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unit tests
        shell: bash
        run: |
          cd VideoSubs
          pip install -r requirements.txt
          python -m pytest tests/unit_tests/ -v --tb=long

  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        shell: bash
        run: |
          V=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.1.0")
          V_num=${V#v}
          echo "VERSION=$V_num" >> "$GITHUB_OUTPUT"
          echo "CleanVersion=$V_num" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agentfront/pnpm-lock.yaml

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress --limit-output

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install -r VideoSubs/requirements.txt
          python -c "import site, shutil, os; [(shutil.copytree(os.path.join(sp, 'whisper', 'assets'), 'VideoSubs/whisper_assets', dirs_exist_ok=True), print('Copied')) for sp in site.getsitepackages() if os.path.isdir(os.path.join(sp, 'whisper', 'assets'))]"

      - name: Build frontend
        shell: bash
        run: |
          cd agentfront
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy frontend
        shell: bash
        run: |
          mkdir -p VideoSubs/frontend_dist
          cp -r agentfront/dist/* VideoSubs/frontend_dist/

      - name: Build PyInstaller EXE
        shell: pwsh
        run: |
          Set-Location VideoSubs
          pyinstaller build_exe.spec --noconfirm --log-level=WARN
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyInstaller failed with exit code $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path dist/VideoCaptionsAI/VideoCaptionsAI.exe)) {
            throw "VideoCaptionsAI.exe was not created"
          }

      - name: Build Inno Setup installer
        shell: bash
        run: |
          cd VideoSubs
          sed -i "s/^AppVersion=.*$/AppVersion=$VERSION/" installer.iss
          iscc installer.iss
          mv VideoCaptionsAI_Setup.exe VideoCaptionsAI_$VERSION.exe
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoCaptionsAI-Windows
          path: |
            VideoSubs/VideoCaptionsAI_*.exe
            VideoSubs/dist/VideoCaptionsAI/VideoCaptionsAI.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoCaptionsAI-Windows
      - uses: softprops/action-gh-release@v2
        with:
          files: VideoCaptionsAI_*.exe
          draft: false
          generate_release_notes: true
